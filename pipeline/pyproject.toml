[project]
name = "terraspectra-pipeline"
version = "0.1.0"
description = "TerraSpectra geospatial pipeline: raw hyperspectral scenes -> C1 cubes and spectral-index layers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "terraspectra-contracts[raster]",
    "rasterio>=1.3.10",
    "numpy>=1.26",
    "scipy>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
prisma = ["h5py>=3.11"]
zarr = ["zarr>=2.18"]

[project.scripts]
terraspectra-pipeline = "terraspectra_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/terraspectra_pipeline"]

[tool.uv.sources]
terraspectra-contracts = { path = "../contracts/python", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "scipy-stubs>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["terraspectra_pipeline", "terraspectra_contracts"]

[tool.mypy]
files = ["src"]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::FutureWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["terraspectra_pipeline"]
