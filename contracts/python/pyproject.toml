[project]
name = "terraspectra-contracts"
version = "1.0.0"
description = "Frozen Day-1 contracts shared by all TerraSpectra modules (constants, schemas, fixtures)."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "numpy>=1.26"]

[project.optional-dependencies]
raster = ["rasterio>=1.3.10"]
torch = ["torch>=2.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/terraspectra_contracts"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning"]
