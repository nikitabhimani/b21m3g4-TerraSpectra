[project]
name = "terraspectra-model"
version = "0.1.0"
description = "TerraSpectra P2: 3D-CNN + Vision Transformer hybrid for pre-visual crop-disease risk (contract C2)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "terraspectra-contracts[torch]",
    "torch>=2.3",
    "lightning>=2.3",
    "torchmetrics>=1.4",
    "numpy>=1.26",
    "scipy>=1.12",
    "pyyaml>=6.0",
    "typer>=0.12",
    "pydantic>=2.7",
]

[project.optional-dependencies]
onnx = ["onnx>=1.16", "onnxruntime>=1.18", "onnxscript>=0.1"]
tracking = ["mlflow>=2.14"]
sim = ["prosail>=2.0"]

[project.scripts]
terraspectra-model = "terraspectra_model.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/terraspectra_model"]

[tool.uv.sources]
terraspectra-contracts = { path = "../contracts/python", editable = true }

[dependency-groups]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]
# ML naming conventions: `import torch.nn.functional as F`, `import lightning as L`, `B, H, W = x.shape`.
ignore = ["N803", "N806", "N812", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument", "pathlib.Path"]

[tool.mypy]
files = ["src"]
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::FutureWarning",
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
