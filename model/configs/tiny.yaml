# Tiny CPU smoke-test configuration (used by the test suite; trains in seconds).
data:
  source: synthetic
  train_samples: 4
  val_samples: 2
  batch_size: 2
  num_workers: 0
  synth:
    backend: builtin

model:
  cnn_channels: [4, 8]
  cnn_spectral_kernels: [7, 5]
  cnn_spectral_strides: [4, 4]
  cnn_out_channels: 16
  patch_size: 16
  embed_dim: 32
  depth: 1
  num_heads: 2
  mlp_ratio: 2.0
  dropout: 0.0
  spectral_tokens: true
  spectral_groups: 10
  decoder_channels: 16

train:
  max_epochs: 1
  precision: 32-true
  accelerator: cpu
  devices: 1
  early_stopping_patience: 0
  output_dir: runs/tiny
  log_every_n_steps: 1

export:
  output_path: runs/tiny/model.pt
