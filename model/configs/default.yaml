# TerraSpectra P2 - default (GPU) training configuration.
# Paths are relative to the working directory (run from model/).
data:
  source: synthetic          # synthetic | benchmarks | npz
  data_dir: data/raw         # Indian Pines / Salinas / Pavia U .mat files
  benchmarks: [indian_pines, salinas, pavia_u]
  npz_paths: []              # e.g. [data/synth/train.npz] from `terraspectra-model synth`
  window_size: 64
  train_samples: 4000        # windows per epoch
  val_samples: 400
  min_valid_fraction: 0.5
  batch_size: 16
  num_workers: 4
  seed: 0
  augment:
    enabled: true
    hflip_p: 0.5
    vflip_p: 0.5
    rot90: true
    spectral_scale: [0.9, 1.1]
    spectral_jitter_std: 0.005
    band_dropout_p: 0.2
    band_dropout_max_bands: 10
  synth:
    backend: builtin         # builtin | prosail | auto
    patch_infected_p: 0.7
    max_blobs: 3
    blob_radius: [4.0, 20.0]
    max_infected_days: 25
    early_stress_min_days: 7
    days_per_pixel: [0.5, 2.0]
    soil_fraction_p: 0.2
    nodata_p: 0.1
    noise_std: 0.004
    healthy_cab: [35.0, 60.0]
    healthy_cw: [0.010, 0.020]
    healthy_lai: [2.0, 5.0]
  proxy:
    ndvi_vegetation_min: 0.4
    baseline_percentile: 50   # field baseline = median of vegetated pixels
    smooth_sigma: 1.0
    rep_shift_nm: [3.0, 8.0]  # [early, high] thresholds on baseline - value
    ndre_drop: [0.03, 0.08]
    pri_drop: [0.02, 0.05]
    cci_drop: [0.03, 0.08]
    visible_ndvi_drop: 0.15
    weights: {rep_shift_nm: 1.0, ndre_drop: 1.0, pri_drop: 0.5, cci_drop: 0.5}
    min_score: 1.5

model:
  variant: hybrid            # hybrid | cnn_only | vit_only (Day 9 ablations)
  cnn_channels: [16, 32, 64]
  cnn_spectral_kernels: [7, 5, 3]
  cnn_spectral_strides: [2, 2, 2]
  cnn_out_channels: 96
  patch_size: 4
  embed_dim: 256
  depth: 6
  num_heads: 8
  mlp_ratio: 4.0
  dropout: 0.1
  attn_dropout: 0.0
  pos_embed: learned         # learned | sincos
  spectral_tokens: true
  spectral_groups: 20
  decoder_channels: 64

train:
  max_epochs: 50
  lr: 3.0e-4
  weight_decay: 0.05
  warmup_fraction: 0.05
  min_lr_ratio: 0.01
  precision: 16-mixed        # falls back to 32-true without CUDA
  accelerator: auto
  devices: auto
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  focal_gamma: 2.0
  class_weights: [0.5, 1.5, 1.5, 1.0]
  ignore_index: -1
  onset_weight: 0.1
  huber_delta: 2.0
  monitor: val/macro_f1
  early_stopping_patience: 10
  output_dir: runs/default
  seed: 42
  log_every_n_steps: 20
  mlflow: false
  mlflow_tracking_uri: null  # e.g. file:./mlruns
  experiment_name: terraspectra-model

export:
  output_path: ../models/model.pt   # repo-root models/ is what the API serves
  fp16: false
  onnx: false
  onnx_opset: 18
  parity_atol: 1.0e-4
  temperature: 1.0
